<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Inter, 'Helvetica Neue', sans-serif">
  <rect width="640" height="360" fill="#FFFFFF"/>
  <text x="32" y="44" fill="#0F172A" font-size="13" font-weight="700">Alpha Scout — Ranking settoriale</text>
  <text x="608" y="44" fill="#94A3B8" font-size="11" text-anchor="end">5 passi sequenziali</text>
  <line x1="32" y1="58" x2="608" y2="58" stroke="#E2E8F0"/>
  <g font-size="11" fill="#64748B">
    <text x="32" y="86">1. Regime macro</text>
    <text x="150" y="86" fill="#0A9B62">✓</text>
    <text x="180" y="86">2. Screening</text>
    <text x="272" y="86" fill="#0A9B62">✓</text>
    <text x="300" y="86">3. Idee</text>
    <text x="352" y="86" fill="#0A9B62">✓</text>
    <text x="380" y="86" fill="#0F172A" font-weight="600">4. Ranking…</text>
  </g>
  <g font-size="12">
    <text x="56" y="140" fill="#0F172A" font-weight="600">01 Semiconduttori</text>
    <rect x="250" y="129" width="290" height="12" rx="6" fill="#EDF1F5"/>
    <rect x="250" y="129" width="276" height="12" rx="6" fill="#3E5C8F"/>
    <text x="608" y="140" fill="#0F172A" font-weight="700" text-anchor="end">9,5</text>

    <text x="56" y="180" fill="#0F172A" font-weight="600">02 Infra cloud</text>
    <rect x="250" y="169" width="290" height="12" rx="6" fill="#EDF1F5"/>
    <rect x="250" y="169" width="238" height="12" rx="6" fill="#3E5C8F" opacity="0.75"/>
    <text x="608" y="180" fill="#334155" text-anchor="end">8,2</text>

    <text x="56" y="220" fill="#0F172A" font-weight="600">03 Difesa EU</text>
    <rect x="250" y="209" width="290" height="12" rx="6" fill="#EDF1F5"/>
    <rect x="250" y="209" width="197" height="12" rx="6" fill="#3E5C8F" opacity="0.5"/>
    <text x="608" y="220" fill="#334155" text-anchor="end">6,8</text>

    <text x="56" y="260" fill="#64748B">04 Utilities</text>
    <rect x="250" y="249" width="290" height="12" rx="6" fill="#EDF1F5"/>
    <rect x="250" y="249" width="136" height="12" rx="6" fill="#3E5C8F" opacity="0.3"/>
    <text x="608" y="260" fill="#94A3B8" text-anchor="end">4,7</text>
  </g>
  <rect x="32" y="300" width="576" height="34" rx="8" fill="#F5F7FA"/>
  <text x="48" y="321" fill="#64748B" font-size="11.5">5. Nota di sintesi: le prime tre idee con i loro "se" espliciti</text>
</svg>
